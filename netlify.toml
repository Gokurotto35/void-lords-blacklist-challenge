# ───────────────────────────────────────────────────────────────
#  Netlify config — Void Lord's Blacklist Challenge
#  Deploy: drag this `site/` folder onto app.netlify.com/drop,
#  or run `netlify deploy --dir=site --prod` from the parent folder.
# ───────────────────────────────────────────────────────────────

[build]
  publish = "."

# Cache the large media aggressively — the files are content-stable.
[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Baseline security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
